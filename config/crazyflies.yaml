fileversion: 3
robots:
  Crazyflie:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E7E7
    initial_position:
    - 0.01429743506014347
    - 0.0032781411428004503
    - 0.014326675795018673
    type: cf21
robot_types:
  cf21:
    motion_capture:
      tracking: vendor
    big_quad: false
    battery:
      voltage_warning: 3.8
      voltage_critical: 3.7
all:
  reference_frame: world
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 20
      status:
        frequency: 1
    custom_topics:
      imu:
        frequency: 10
        vars:
        - acc.x
        - acc.y
        - acc.z
      actuators:
        frequency: 20
        vars:
        - motor.m1
        - motor.m2
        - motor.m3
        - motor.m4
        - gyro.z
        - stabilizer.yaw
      pdg:
        frequency: 10
        vars:
        - pdg.updates
        - pdg.capActive
        - pdg.requested
        - pdg.commanded
      mellinger_control:
        frequency: 20
        vars:
        - ctrlMel.cmd_yaw
        - ctrlMel.r_yaw
        - ctrlMel.cmd_roll
        - ctrlMel.cmd_pitch
        - ctrlMel.cmd_thrust
        - ctrlMel.i_err_z
      mocap_rx_position:
        frequency: 10
        vars:
        - locSrv.x
        - locSrv.y
        - locSrv.z
        - locSrvZ.tick
      mocap_rx_orientation:
        frequency: 10
        vars:
        - locSrv.qx
        - locSrv.qy
        - locSrv.qz
        - locSrv.qw
      vertical_control:
        frequency: 5
        vars:
        - controller.actuatorThrust
        - posCtl.targetZ
        - posCtl.targetVZ
        - stateEstimate.z
        - stateEstimate.vz
        - pm.vbat
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2
      controller: 0
    pdg:
      capEnable: 0
      maxCollective: 65535.0
    locSrv:
      extPosStdDev: 0.001
      extQuatStdDev: 0.05
